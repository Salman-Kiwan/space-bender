<canvas id="c" width="500" height="150" style="background:#111"></canvas>
<button id="go">Go</button>

<script>
const ctx = document.getElementById("c").getContext("2d");

let x = 50;                 // the thing that moves (later: your m)
let start, target, startTime;

function draw() {
  ctx.clearRect(0, 0, 500, 150);
  ctx.fillStyle = "cyan";
  ctx.beginPath();
  ctx.arc(x, 75, 15, 0, 7);
  ctx.fill();
}

// runs every frame; the browser gives it the current time
function frame(now) {
  const t = Math.min(1, (now - startTime) / 10000);   // 2-second trip
  x = start + t * (target - start);                   // blend
  draw();
  if (t < 1) requestAnimationFrame(frame);            // book the next frame, or stop
}

// runs ONCE per click: decide the trip, start the clock, start the loop
document.getElementById("go").addEventListener("click", () => {
  start = x;                        // where we are now
  target = x < 250 ? 450 : 50;      // where we're going (flip sides)
  startTime = performance.now();    // the moment of the click
  requestAnimationFrame(frame);     // kick off the loop
});


draw();
</script>
